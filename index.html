<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#fcfcfb"/>
    <script>
      // Run before the prerendered page paints or the browser restores scroll.
      if (performance.getEntriesByType('navigation')[0]?.type === 'reload') {
        const previousRestoration = history.scrollRestoration;
        history.scrollRestoration = 'manual';
        const resetScroll = () => window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
        resetScroll();
        window.addEventListener('pageshow', resetScroll, { once: true });
        window.addEventListener('pagehide', () => {
          history.scrollRestoration = previousRestoration;
        }, { once: true });
      }
    </script>
    <link rel="preload" href="/fonts/dm-sans-variable.ttf" as="font" type="font/ttf" crossorigin/>
